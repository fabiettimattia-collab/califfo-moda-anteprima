// Orari settimanali già presenti nel brief, in minuti dall'inizio del giorno; festività da confermare.
// Europe/Rome rende lo stato indipendente dal fuso del dispositivo, anche nei passaggi dell'ora legale.
const STORE_HOURS=Array.from({length:7},(_,day)=>day===0?[[600,810]]:[[600,810],[900,1170]]);
const ROME_CLOCK=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function storeStatus(now=new Date()){
  const parts=Object.fromEntries(ROME_CLOCK.formatToParts(now).map(p=>[p.type,p.value]));
  const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.weekday),minute=Number(parts.hour)*60+Number(parts.minute);
  if(STORE_HOURS[day].some(([start,end])=>minute>=start&&minute<end))return{open:true,day};
  for(let offset=0;offset<7;offset++){const nextDay=(day+offset)%7;for(const[start]of STORE_HOURS[nextDay])if(offset>0||minute<start)return{open:false,day:nextDay,minute:start}}
}
function updateStoreStatus(now=new Date()){
  const bar=document.getElementById('store-status-bar');if(!bar)return;
  const state=storeStatus(now),time=state.open?'':String(Math.floor(state.minute/60)).padStart(2,'0')+':'+String(state.minute%60).padStart(2,'0');
  const label=state.open?t('storeOpenNow'):t('storeOpensAt').replace('{day}',t('statusDays')[state.day]).replace('{time}',time);
  const markup='<span class="status-item"><i class="status-dot" aria-hidden="true"></i>'+esc(t('shopOnline'))+'</span><span class="status-item '+(state.open?'is-open':'is-closed')+'" title="'+esc(t('statusTimezone'))+'"><i class="status-dot" aria-hidden="true"></i><span><span class="status-label">'+esc(t('statusStore'))+' · </span>'+esc(label)+'</span></span>';
  if(bar.innerHTML!==markup)bar.innerHTML=markup;
}

function checkoutPage(){if(!cart.length)return cartPage();const fields=[['firstName','Alex','given-name'],['lastName','Esempio','family-name'],['email','alex@example.test','email'],['address','Via Esempio 10','street-address'],['city','Roma','address-level2'],['postcode','00100','postal-code'],['country',lang==='it'?'Italia':'Italy','country-name']];return pageHead(t('checkoutTitle'),t('checkoutIntro'))+`<section class="wrap checkout"><div><div class="note">${t('noPayment')}</div><h2>${t('contactTitle')}</h2><div class="form-grid">${fields.map(([key,value])=>`<label class="field ${['email','address','country'].includes(key)?'full':''}">${t(key)}<input type="${key==='email'?'email':'text'}" value="${value}" autocomplete="off" spellcheck="false" data-demo-field="${key}" aria-label="${t(key)} · ${t('demoOnly')}"></label>`).join('')}</div><h2>${t('shipTitle')}</h2><div class="shipping-options">${['italy','eu','world','pickup'].map(k=>`<label><input type="radio" name="shipping" value="${k}" ${shippingChoice===k?'checked':''}><span>${t(k)}<small>${k==='pickup'?t('pickupAddress'):t('confirmShipping')}</small></span><strong>${k==='pickup'?t('free'):money({italy:8,eu:18,world:35}[k])}</strong></label>`).join('')}</div><h2>${t('paymentTitle')}</h2><div class="payment-preview" aria-label="${t('paymentTitle')}">${[t('card'),'Apple Pay','Google Pay','PayPal',t('payPickup')].map(x=>'<span>'+x+'</span>').join('')}</div><p class="muted" style="font-size:11px">${t('paymentNote')}</p><button type="button" class="btn wide visually-spaced" data-action="simulate">${t('simulate')} →</button><p class="muted" style="font-size:10px;margin-top:10px">${t('noPayment')}</p></div><div id="checkout-summary">${summary(true)}</div></section>`}
function confirmation(){return`<section class="wrap confirmation"><div class="seal">✓</div><div class="eyebrow muted">${t('demoOnly')}</div><h1 style="margin-top:14px">${t('doneTitle')}</h1><p>${t('doneText')}</p><div class="note">${t('fakeOrder')} · ${confirmationNumber||'DEMO-CM-0001'}</div><p>${t('doneNext')}</p><a class="btn" href="#/">${t('backHome')} ↗</a></section>`}
function contentPage(route){let key='',content='';if(route==='/chi-siamo'){key='about';content=`<p>${t('aboutLead')}</p><p>${t('aboutText')}</p><div class="note">${t('aboutOpen')}</div><a class="linkline" href="#/contatti">${t('visitLabel')} ↗</a>`}else if(route==='/contatti'){key='contacts';content=`<p>${t('contactsLead')}</p><h2>Califfo Moda</h2><p>Via Merulana 277, 00184 ${lang==='it'?'Roma':'Rome'}<br><a href="tel:+39064814023">+39 06 481 4023</a></p><h2>${t('hoursTitle')}</h2><p>${t('hours')}</p><p><a class="linkline" href="${mapUrl}" target="_blank" rel="noopener noreferrer">${t('maps')} ↗</a></p><p style="font-size:11px">${t('mapPrivacy')}</p><div class="note">${t('businessDetails')}</div>`}else if(route==='/spedizioni-resi'){key='shipping';content=`<p>${t('shippingLead')}</p><table><thead><tr><th>${t('zone')}</th><th>${t('sampleRate')}</th></tr></thead><tbody>${[['italy',8],['eu',18],['world',35],['pickup',0]].map(([k,n])=>'<tr><td>'+t(k)+'</td><td>'+money(n)+'</td></tr>').join('')}</tbody></table><p class="inline-warning">${t('confirmShipping')}</p><h2>${t('trackingTitle')}</h2><p>${t('trackingText')}</p><h2>${t('returnsTitle')}</h2><p>${t('returnsText')}</p><div class="note">${t('returnsOpen')}</div>`}else if(route==='/guida-taglie'){key='sizeGuide';content=guide()}else if(route==='/faq'){key='faq';content=Array.from({length:5},(_,i)=>`<details ${i===0?'open':''}><summary>${t('faq'+(i+1)+'q')}</summary><p>${t('faq'+(i+1)+'a')}</p></details>`).join('')}else if(['/privacy','/cookie','/condizioni'].includes(route)){key=route==='/privacy'?'privacy':route==='/cookie'?'cookie':'terms';content=`<p>${t('legalText')}</p><div class="note">${t('legalNote')}</div>`}else{key='notFound';content=`<a class="btn" href="#/">${t('backHome')}</a>`}return`<section class="wrap content-page"><div class="breadcrumb"><a href="#/">${t('home')}</a> / ${t(key)}</div><h1>${t(key)}</h1>${content}</section>`}
function render(scroll=false){const route=location.hash.slice(1)||'/';if(route!==currentRoute){selectedSize=null;galleryView=0;if(!route.startsWith('/prodotto/')&&route!=='/cerca'){filters={size:'',color:'',price:'',category:'',sort:'featured'};searchTerm=''}currentRoute=route}header();footer();let html;if(route==='/')html=home();else if(['/donna','/uomo','/novita','/cerca'].includes(route))html=catalog(route);else if(route.startsWith('/prodotto/')){const p=P.find(p=>p.id===route.split('/')[2]);html=p?product(p):contentPage('/404')}else if(route==='/preferiti')html=favoritePage();else if(route==='/carrello')html=cartPage();else if(route==='/checkout')html=checkoutPage();else if(route==='/conferma')html=confirmation();else html=contentPage(route);document.getElementById('app').innerHTML=html;hero3d.mount(route==='/');document.title='Califfo Moda — '+(lang==='it'?'Roma':'Rome');if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function toast(message){clearTimeout(toastTimer);const box=document.getElementById('toast');box.textContent=message;box.hidden=false;toastTimer=setTimeout(()=>box.hidden=true,3500)}
function openModal(name,html,drawer=false){const m=document.getElementById('modal');m.className=drawer?'drawer':'';document.getElementById('modal-title').textContent=name;document.getElementById('modal-body').innerHTML=html;if(!m.open)m.showModal()}
function closeModal(){document.getElementById('modal').close()}
function openCart(){openModal(t('cart')+' ('+count()+')',cart.length?cartItems()+`<div class="summary-row"><span>${t('subtotal')}</span><strong>${money(subtotal())}</strong></div><p class="muted" style="font-size:10px">${t('cartNote')}</p><a class="btn wide" href="#/carrello" data-action="close-modal">${t('viewCart')} →</a><a class="btn light wide" href="#/checkout" data-action="close-modal">${t('goCheckout')}</a>`:emptyCart(),true)}
function saveCart(){writeStore('califfo-cart',cart);header();if(currentRoute==='/carrello'||currentRoute==='/checkout')render();if(document.getElementById('modal').open&&document.getElementById('modal').classList.contains('drawer'))openCart()}
function runSearch(){const input=document.getElementById('search-input');searchTerm=input?input.value.trim():'';filters={size:'',color:'',price:'',category:'',sort:'featured'};if(location.hash==='#/cerca')render(true);else location.hash='/cerca'}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id,p=P.find(p=>p.id===id);if(action==='language'){lang=lang==='it'?'en':'it';writeStore('califfo-language',lang);closeModal();render()}else if(action==='search-toggle'){const box=document.getElementById('searchbox');box.hidden=!box.hidden;if(!box.hidden)document.getElementById('search-input').focus()}else if(action==='search-go')runSearch();else if(action==='cart-open')openCart();else if(action==='close-modal')closeModal();else if(action==='favorite'&&p){const found=favorites.includes(id);favorites=found?favorites.filter(x=>x!==id):[...favorites,id];writeStore('califfo-favorites',favorites);render();toast(t(found?'removedFavorite':'addedFavorite'))}else if(action==='reset-filters'){filters={size:'',color:'',price:'',category:'',sort:'featured'};searchTerm='';render()}else if(action==='size'){selectedSize=Number(el.dataset.size);render()}else if(action==='gallery'){galleryView=Number(el.dataset.view);render()}else if(action==='zoom'&&p)openModal(title(p),shoe(p,galleryView));else if(action==='guide')openModal(t('sizeGuide'),guide());else if(action==='add-cart'&&p){if(selectedSize===null){toast(t('chooseSizeNotice'));return}const max=p.stock[selectedSize-(p.gender==='donna'?35:39)]||0;if(!max){toast(t('chooseSizeNotice'));return}const existing=cart.find(x=>x.id===id&&x.size===selectedSize);if(existing&&existing.qty>=max){toast(t('stockLimit'));return}if(existing)existing.qty++;else cart.push({id,size:selectedSize,qty:1});saveCart();openCart()}else if(action==='quantity'){const size=Number(el.dataset.size),item=cart.find(x=>x.id===id&&x.size===size);if(!item||!p)return;const newQty=item.qty+Number(el.dataset.delta),max=p.stock[size-(p.gender==='donna'?35:39)]||0;if(newQty>max){toast(t('stockLimit'));return}if(newQty<1)cart=cart.filter(x=>x!==item);else item.qty=newQty;saveCart()}else if(action==='remove-cart'){cart=cart.filter(x=>!(x.id===id&&x.size===Number(el.dataset.size)));saveCart();toast(t('itemRemoved'))}else if(action==='simulate'){if(!cart.length){toast(t('checkoutEmpty'));return}confirmationNumber='DEMO-CM-'+String(Math.floor(Math.random()*9000)+1000);cart=[];writeStore('califfo-cart',cart);location.hash='/conferma'}});
document.addEventListener('change',event=>{const el=event.target;if(el.matches('[data-filter]')){filters[el.dataset.filter]=el.value;render()}else if(el.matches('input[name="shipping"]')){shippingChoice=el.value;document.getElementById('checkout-summary').innerHTML=summary(true)}});
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.id==='search-input'){event.preventDefault();runSearch()}});
document.getElementById('modal-close').addEventListener('click',closeModal);document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
document.getElementById('whatsapp').addEventListener('click',()=>openModal(t('whatsapp'),'<p>'+t('whatsappNotice')+'</p>'));
document.getElementById('cookie-close').addEventListener('click',()=>{document.getElementById('cookie').hidden=true});
/* Versione semplice: senza apertura 3D resta l'illustrazione. */const hero3d={mount(){}};
window.addEventListener('hashchange',()=>{closeModal();render(true)});render();
// Un solo timer; cambiano soltanto i badge, senza interrompere ricerca, carrello o scena.
if(typeof setInterval==='function')setInterval(()=>{if(!document.hidden)updateStoreStatus()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateStoreStatus()});
window.addEventListener('focus',()=>updateStoreStatus());
window.addEventListener('pageshow',()=>updateStoreStatus());
</script>
</body>
