// Orari settimanali già presenti nel brief, in minuti dall'inizio del giorno; festività da confermare.
// Europe/Rome rende lo stato indipendente dal fuso del dispositivo, anche nei passaggi dell'ora legale.
const STORE_HOURS=Array.from({length:7},(_,day)=>day===0?[[600,810]]:[[600,810],[900,1170]]);
const ROME_CLOCK=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Rome',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function storeStatus(now=new Date()){
  const parts=Object.fromEntries(ROME_CLOCK.formatToParts(now).map(p=>[p.type,p.value]));
  const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(parts.weekday),minute=Number(parts.hour)*60+Number(parts.minute);
  if(STORE_HOURS[day].some(([start,end])=>minute>=start&&minute<end))return{open:true,day};
  for(let offset=0;offset<7;offset++){const nextDay=(day+offset)%7;for(const[start]of STORE_HOURS[nextDay])if(offset>0||minute<start)return{open:false,day:nextDay,minute:start}}
}
function updateStoreStatus(now=new Date()){
  const bar=document.getElementById('store-status-bar');if(!bar)return;
  const state=storeStatus(now),time=state.open?'':String(Math.floor(state.minute/60)).padStart(2,'0')+':'+String(state.minute%60).padStart(2,'0');
  const label=state.open?t('storeOpenNow'):t('storeOpensAt').replace('{day}',t('statusDays')[state.day]).replace('{time}',time);
  const markup='<span class="status-item"><i class="status-dot" aria-hidden="true"></i>'+esc(t('shopOnline'))+'</span><span class="status-item '+(state.open?'is-open':'is-closed')+'" title="'+esc(t('statusTimezone'))+'"><i class="status-dot" aria-hidden="true"></i><span><span class="status-label">'+esc(t('statusStore'))+' · </span>'+esc(label)+'</span></span>';
  if(bar.innerHTML!==markup)bar.innerHTML=markup;
}
